<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Hotspot - Магазин электронных сигарет" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <title>Hotspot - Магазин электронных сигарет</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            
            --radius: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--white);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--gray-100);
            padding: 8px 16px;
            border-radius: var(--radius);
            font-weight: 600;
            color: var(--gray-700);
        }

        .balance-icon {
            color: var(--primary);
        }

        /* Search Bar */
        .search-container {
            background: var(--white);
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: var(--gray-800);
        }

        .search-input::placeholder {
            color: var(--gray-500);
        }

        .search-icon {
            color: var(--gray-500);
        }

        /* Main Content */
        .main {
            padding: 20px 0 100px 0;
            min-height: calc(100vh - 200px);
        }

        /* Promo Banner */
        .promo-banner {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .promo-content {
            position: relative;
            z-index: 1;
        }

        .promo-icon {
            font-size: 28px;
            margin-bottom: 8px;
            display: block;
        }

        .promo-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .promo-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Categories Grid */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .category-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .category-icon {
            width: 50px;
            height: 50px;
            background: var(--gray-100);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .category-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 4px;
        }

        .category-description {
            color: var(--gray-600);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .category-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .category-badge {
            background: var(--primary);
            color: var(--white);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .category-arrow {
            color: var(--gray-400);
            transition: transform 0.3s ease;
        }

        .category-card:hover .category-arrow {
            transform: translateX(4px);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .product-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .product-image {
            width: 100%;
            height: 120px;
            background: var(--gray-100);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 32px;
            color: var(--gray-400);
        }

        .product-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
        }

        .product-action {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--gray-200);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--gray-600);
        }

        .product-action:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .product-action.favorite.active {
            background: var(--error);
            color: var(--white);
            border-color: var(--error);
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .product-stock {
            font-size: 12px;
            color: var(--gray-600);
            margin-bottom: 8px;
        }

        .product-variants {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }

        .variant-tag {
            font-size: 11px;
            padding: 2px 6px;
            background: var(--gray-100);
            color: var(--gray-600);
            border-radius: 4px;
        }

        .variant-tag.available {
            background: var(--success);
            color: var(--white);
        }

        .variant-tag.out-of-stock {
            background: var(--error);
            color: var(--white);
        }

        /* Cart */
        .cart-item {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .cart-item-image {
            width: 60px;
            height: 60px;
            background: var(--gray-100);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--gray-400);
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 4px;
        }

        .cart-item-variant {
            font-size: 14px;
            color: var(--gray-600);
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-weight: 700;
            color: var(--primary);
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--gray-100);
            border-radius: var(--radius);
            padding: 4px;
        }

        .quantity-btn {
            width: 24px;
            height: 24px;
            background: var(--white);
            border: 1px solid var(--gray-300);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            color: var(--gray-600);
        }

        .quantity-btn:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .quantity-input {
            width: 40px;
            text-align: center;
            border: none;
            background: transparent;
            font-weight: 600;
            color: var(--gray-800);
        }

        .remove-btn {
            width: 32px;
            height: 32px;
            background: var(--error);
            color: var(--white);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-btn:hover {
            background: #dc2626;
        }

        /* Checkout */
        .checkout-section {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 16px;
            background: var(--white);
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .radio-group {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .radio-label {
            font-weight: 500;
            color: var(--gray-700);
        }

        .promo-section {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
        }

        .promo-input-group {
            display: flex;
            gap: 8px;
        }

        .promo-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 14px;
        }

        .promo-btn {
            padding: 10px 16px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .promo-btn:hover {
            background: var(--primary-dark);
        }

        .promo-btn:disabled {
            background: var(--gray-400);
            cursor: not-allowed;
        }

        .promo-applied {
            background: var(--success);
            color: var(--white);
            padding: 8px 12px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .promo-remove {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            font-size: 16px;
        }

        /* Order Summary */
        .order-summary {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 20px;
            position: sticky;
            top: 100px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .summary-label {
            color: var(--gray-600);
        }

        .summary-value {
            font-weight: 600;
            color: var(--gray-800);
        }

        .summary-total {
            border-top: 1px solid var(--gray-200);
            padding-top: 12px;
            margin-top: 12px;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 16px;
        }

        .checkout-btn:hover {
            background: var(--primary-dark);
        }

        .checkout-btn:disabled {
            background: var(--gray-400);
            cursor: not-allowed;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-top: 1px solid var(--gray-200);
            padding: 8px 0;
            z-index: 100;
            box-shadow: var(--shadow-lg);
        }

        .nav-items {
            display: flex;
            justify-content: space-around;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: var(--radius);
            color: var(--gray-500);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 12px;
            font-weight: 500;
        }

        .nav-item:hover,
        .nav-item.active {
            color: var(--primary);
            background: var(--gray-50);
        }

        .nav-icon {
            font-size: 20px;
        }

        .nav-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--error);
            color: var(--white);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: var(--gray-600);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--gray-200);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        /* Error */
        .error {
            background: var(--error);
            color: var(--white);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .error-message {
            opacity: 0.9;
        }

        /* Success */
        .success {
            background: var(--success);
            color: var(--white);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .success-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .success-message {
            opacity: 0.9;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray-500);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            color: var(--gray-300);
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--gray-600);
        }

        .empty-message {
            font-size: 14px;
        }

        /* Animations */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0 12px;
            }
            
            .categories-grid,
            .products-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            
            .header-actions {
                gap: 8px;
            }
            
            .balance {
                padding: 6px 12px;
                font-size: 14px;
            }
            
            .nav-items {
                padding: 0 12px;
            }
            
            .nav-item {
                padding: 6px 8px;
                font-size: 11px;
            }
            
            .nav-icon {
                font-size: 18px;
            }
        }

        /* Developer Credit */
        .dev-credit {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(37, 99, 235, 0.7);
            color: var(--white);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 500;
            z-index: 1000;
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease-out, fadeOut 1s ease-in 3s forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
        }

        .dev-credit a {
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
        }

        .dev-credit a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Developer Credit -->
    <div class="dev-credit">
        Разработано <a href="https://t.me/x32asm" target="_blank">@x32asm</a>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo" onclick="showPage('home')">
                    <div class="logo-icon">
                        <i class="fas fa-smoking"></i>
                    </div>
                    <div class="logo-text">Hotspot</div>
                </a>
                
                <div class="header-actions">
                    <div class="balance">
                        <i class="fas fa-wallet balance-icon"></i>
                        <span id="userBalance">0₽</span>
                    </div>
                    <div class="balance">
                        <i class="fas fa-gift balance-icon"></i>
                        <span id="userCashback">0₽</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Home Page -->
            <div id="homePage" class="page">
                <!-- Search Bar -->
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" placeholder="Поиск товаров..." id="searchInput">
                </div>

                <!-- Promo Banner -->
                <div class="promo-banner">
                    <div class="promo-content">

            <!-- Search Page -->

                </div>
                <div class="products-grid" id="searchResults">

            <!-- Favorites Page -->
            <div id="favoritesPage" class="page" style="display: none;">

            <!-- Profile Page -->
            <div id="profilePage" class="page" style="display: none;">

                    <h2 class="section-title">
                        <i class="fas fa-user"></i>

                    <div class="form-group">
                        <label class="form-label">Имя</label>
                        <input type="text" class="form-input" id="profileName" readonly>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="profileUsername" readonly>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Telegram ID</label>
                        <input type="text" class="form-input" id="profileTelegramId" readonly>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Телефон</label>
                        <input type="text" class="form-input" id="profilePhone" readonly>
                    </div>
                </div>

                <div class="checkout-section">
                    <h2 class="section-title">
                        <i class="fas fa-chart-line"></i>
                        Статистика кешбека
                    </h2>
                    <div id="cashbackStats">
                        <!-- Cashback stats will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Cart Page -->
            <div id="cartPage" class="page" style="display: none;">
                <div id="cartItems">
                    <!-- Cart items will be loaded here -->
                </div>
                
                <div class="checkout-section">
                    <h2 class="section-title">
                        <i class="fas fa-truck"></i>
                        Способ получения
                    </h2>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="delivery" value="pickup" class="radio-input" checked>
                            <span class="radio-label">Самовывоз</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="delivery" value="delivery" class="radio-input">
                            <span class="radio-label">Доставка (+300₽)</span>
                        </label>
                    </div>
                    
                    <div id="pickupOptions" class="form-group">
                        <label class="form-label">Место самовывоза</label>
                        <select class="form-select" id="pickupLocation">
                            <option value="center">Центр (12:00-17:00)</option>
                            <option value="tc">ТЦ (16:30-21:00)</option>
                        </select>
                    </div>
                    
                    <div id="deliveryOptions" class="form-group" style="display: none;">
                        <label class="form-label">Адрес доставки</label>
                        <input type="text" class="form-input" id="deliveryAddress" placeholder="Введите адрес доставки">
                    </div>
                </div>

                <div class="checkout-section">
                    <h2 class="section-title">
                        <i class="fas fa-user"></i>
                        Контактная информация
                    </h2>
                    <div class="form-group">
                        <label class="form-label">Имя</label>
                        <input type="text" class="form-input" id="customerName" placeholder="Введите ваше имя">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Телефон</label>
                        <input type="tel" class="form-input" id="customerPhone" placeholder="Введите номер телефона">
                    </div>
                </div>

                <div class="checkout-section">
                    <h2 class="section-title">
                        <i class="fas fa-ticket-alt"></i>
                        Промокод
                    </h2>
                    <div class="promo-section">
                        <div class="promo-input-group">
                            <input type="text" class="promo-input" id="promoCode" placeholder="Введите промокод">
                            <button class="promo-btn" id="applyPromoBtn">Применить</button>
                        </div>
                        <div id="promoApplied" style="display: none;"></div>
                    </div>
                </div>

                <div class="checkout-section">
                    <h2 class="section-title">
                        <i class="fas fa-credit-card"></i>
                        Способ оплаты
                    </h2>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="payment" value="sbp_online" class="radio-input">
                            <span class="radio-label">СБП онлайн</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="payment" value="sbp_receipt" class="radio-input">
                            <span class="radio-label">СБП при получении</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="payment" value="cash" class="radio-input">
                            <span class="radio-label">Наличными</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="payment" value="balance" class="radio-input">
                            <span class="radio-label">Баланс сайта</span>
                        </label>
                    </div>
                </div>

                <div class="order-summary">
                    <h3 class="section-title">Итого</h3>
                    <div class="summary-row">
                        <span class="summary-label">Товары:</span>
                        <span class="summary-value" id="subtotal">0₽</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Доставка:</span>
                        <span class="summary-value" id="deliveryCost">0₽</span>
                    </div>
                    <div class="summary-row" id="promoDiscountRow" style="display: none;">
                        <span class="summary-label">Скидка:</span>
                        <span class="summary-value" id="promoDiscount">-0₽</span>
                    </div>
                    <div class="summary-total">
                        <span class="summary-label">К оплате:</span>
                        <span class="summary-value" id="total">0₽</span>
                    </div>
                    <button class="checkout-btn" id="checkoutBtn" disabled>Оформить заказ</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-items">
            <a href="#" class="nav-item active" onclick="showPage('home')">
                <i class="fas fa-home nav-icon"></i>
                <span>Главная</span>
            </a>
            <a href="#" class="nav-item" onclick="showPage('search')">
                <i class="fas fa-search nav-icon"></i>
                <span>Поиск</span>
            </a>
            <a href="#" class="nav-item" onclick="showPage('cart')">
                <i class="fas fa-shopping-cart nav-icon"></i>
                <span>Корзина</span>
                <span class="nav-badge" id="cartBadge" style="display: none;">0</span>
            </a>
            <a href="#" class="nav-item" onclick="showPage('favorites')">
                <i class="fas fa-heart nav-icon"></i>
                <span>Избранное</span>
                <span class="nav-badge" id="favoritesBadge" style="display: none;">0</span>
            </a>
            <a href="#" class="nav-item" onclick="showPage('profile')">
                <i class="fas fa-user nav-icon"></i>
                <span>Профиль</span>
            </a>
        </div>
    </nav>

    <script>
        // Global state
        let currentUser = null;
        let categories = [];
        let products = [];
        let cart = [];
        let favorites = [];
        let currentPromo = null;
        let searchQuery = '';

        // Promo banners data
        const promoBanners = [
            { icon: 'fas fa-gift', title: 'Кешбек до 3.5% на все товары!', subtitle: 'Получайте деньги за каждую покупку' },
            { icon: 'fas fa-bolt', title: 'Новинки в каталоге каждую неделю!', subtitle: 'Следите за обновлениями' },
            { icon: 'fas fa-chart-line', title: 'Скидки до 20% на избранные товары!', subtitle: 'Экономите на любимых вкусах' },
            { icon: 'fas fa-truck', title: 'Быстрая доставка по городу!', subtitle: 'Получите заказ в тот же день' },
            { icon: 'fas fa-credit-card', title: 'Оплата онлайн или при получении!', subtitle: 'Удобно и безопасно' }
        ];

        let currentPromoIndex = 0;

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            // Проверяем, что мы в Telegram WebApp
            if (window.Telegram && window.Telegram.WebApp) {
                initializeApp();
                setupPromoRotation();
                setupEventListeners();
            } else {
                // Если не в Telegram, показываем ошибку
                showError('Откройте через Mini App в Telegram!');
            }
        });

        // Initialize app
        async function initializeApp() {
            try {
                // Check if running in Telegram WebApp
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();
                    
                    console.log('Telegram WebApp detected');
                    console.log('initDataUnsafe:', tg.initDataUnsafe);
                    console.log('initData:', tg.initData);
                    
                    const user = tg.initDataUnsafe?.user;
                    if (user) {
                        console.log('User data found:', user);
                        currentUser = user;
                        await authenticateUser(user);
                    } else {
                        console.log('No user data, trying to get from initData');
                        
                        // Попробуем получить данные из initData
                        if (tg.initData) {
                            console.log('initData available, parsing...');
                            try {
                                const urlParams = new URLSearchParams(tg.initData);
                                const userParam = urlParams.get('user');
                                if (userParam) {
                                    const userData = JSON.parse(decodeURIComponent(userParam));
                                    console.log('Parsed user data:', userData);
                                    currentUser = userData;
                                    await authenticateUser(userData);
                                } else {
                                    console.log('No user in initData');
                                    showError('Откройте через кнопку в боте!');
                                    return;
                                }
                            } catch (parseError) {
                                console.error('Error parsing initData:', parseError);
                                showError('Ошибка получения данных пользователя');
                                return;
                            }
                        } else {
                            console.log('No initData available');
                            showError('Откройте через кнопку в боте!');
                            return;
                        }
                    }
                } else {
                    console.log('Telegram WebApp not detected');
                    showError('Откройте через Mini App в Telegram!');
                    return;
                }
                
            } catch (error) {
                console.error('Error initializing app:', error);
                showError('Ошибка загрузки приложения');
            }
        }

        // Authenticate user
        async function authenticateUser(user) {
            try {
                console.log('Authenticating user:', user);
                
                const response = await fetch('/api/users/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        telegram_id: user.id,
                        username: user.username,
                        first_name: user.first_name
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('Auth successful:', data);
                    currentUser = data;
                    updateUserInfo(data);
                    localStorage.setItem('token', data.access_token);
                    
                    // Загружаем данные после успешной авторизации
                    await loadCategories();
                    await loadProducts();
                    await loadFavorites();
                    await loadCart();
                    
                    // Показываем главную страницу
                    showPage('home');
                } else {
                    const error = await response.json();
                    console.error('Auth failed:', error);
                    showError('Ошибка авторизации: ' + (error.detail || 'Неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Auth error:', error);
                showError('Ошибка подключения к серверу');
            }
        }

        // Update user info display
        function updateUserInfo(user) {
            document.getElementById('userBalance').textContent = `${user.balance || 0}₽`;
            document.getElementById('userCashback').textContent = `${user.cashback_balance || 0}₽`;
            
            // Update profile page
            document.getElementById('profileName').value = user.first_name || '';
            document.getElementById('profileUsername').value = user.username || '';
            document.getElementById('profileTelegramId').value = user.telegram_id || '';
            document.getElementById('profilePhone').value = user.phone || '';
        }

        // Load categories
        async function loadCategories() {
            try {
                const response = await fetch('/api/categories');
                if (response.ok) {
                    categories = await response.json();
                    renderCategories();
                }
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // Render categories
        function renderCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '';

            categories.forEach(category => {
                const card = createCategoryCard(category);
                grid.appendChild(card);
            });
        }

        // Create category card
        function createCategoryCard(category) {
            const card = document.createElement('div');
            card.className = 'category-card';
            card.onclick = () => openCategory(category.id);

            const icon = getCategoryIcon(category.name);

            card.innerHTML = `
                <div class="category-icon">
                    <i class="${icon}"></i>
                </div>
                <div class="category-title">${category.name}</div>
                <div class="category-description">${category.description || 'Категория товаров'}</div>
                <div class="category-meta">
                    <div class="category-badge">Кешбек ${category.cashback_percent}%</div>
                    <i class="fas fa-arrow-right category-arrow"></i>
                </div>
            `;

            return card;
        }

        // Get category icon
        function getCategoryIcon(categoryName) {
            if (categoryName.includes('Жидкости')) return 'fas fa-tint';
            if (categoryName.includes('POD')) return 'fas fa-microchip';
            if (categoryName.includes('Картриджи')) return 'fas fa-star';
            if (categoryName.includes('Заправка')) return 'fas fa-flask';
            return 'fas fa-shopping-bag';
        }

        // Load products
        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                if (response.ok) {
                    products = await response.json();
                    renderProducts(products);
                }
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        // Render products
        function renderProducts(productsToRender) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (productsToRender.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-box-open"></i>
                        </div>
                        <div class="empty-title">Товары не найдены</div>
                        <div class="empty-message">Попробуйте изменить поисковый запрос</div>
                    </div>
                `;
                return;
            }

            productsToRender.forEach(product => {
                const card = createProductCard(product);
                grid.appendChild(card);
            });
        }

        // Create product card
        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.onclick = () => openProduct(product.id);

            const isFavorite = favorites.some(fav => fav.id === product.id);
            const isInCart = cart.some(item => item.product_id === product.id);

            card.innerHTML = `
                <div class="product-actions">
                    <button class="product-action ${isFavorite ? 'favorite active' : 'favorite'}" onclick="toggleFavorite(${product.id}, event)">
                        <i class="fas fa-heart"></i>
                    </button>
                    <button class="product-action" onclick="addToCart(${product.id}, event)">
                        <i class="fas fa-shopping-cart"></i>
                    </button>
                </div>
                <div class="product-image">
                    <i class="fas fa-box"></i>
                </div>
                <div class="product-title">${product.name}</div>
                <div class="product-price">${product.price}₽</div>
                <div class="product-stock">${product.quantity > 0 ? `В наличии: ${product.quantity} шт.` : 'Закончился'}</div>
                ${product.has_variants && product.variants ? `
                    <div class="product-variants">
                        ${product.variants.slice(0, 3).map(variant => `
                            <span class="variant-tag ${variant.quantity > 0 ? 'available' : 'out-of-stock'}">
                                ${variant.name}
                            </span>
                        `).join('')}
                        ${product.variants.length > 3 ? `<span class="variant-tag">+${product.variants.length - 3}</span>` : ''}
                    </div>
                ` : ''}
            `;

            return card;
        }

        // Load favorites
        async function loadFavorites() {
            try {
                const response = await fetch('/api/favorites', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (response.ok) {
                    favorites = await response.json();
                    updateFavoritesBadge();
                }
            } catch (error) {
                console.error('Error loading favorites:', error);
            }
        }

        // Load cart
        async function loadCart() {
            try {
                const response = await fetch('/api/cart', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (response.ok) {
                    cart = await response.json();
                    renderCart();
                    updateCartBadge();
                }
            } catch (error) {
                console.error('Error loading cart:', error);
            }
        }

        // Render cart
        function renderCart() {
            const container = document.getElementById('cartItems');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <div class="empty-title">Корзина пуста</div>
                        <div class="empty-message">Добавьте товары из каталога</div>
                    </div>
                `;
                return;
            }

            cart.forEach(item => {
                const cartItem = createCartItem(item);
                container.appendChild(cartItem);
            });

            updateOrderSummary();
        }

        // Create cart item
        function createCartItem(item) {
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div class="cart-item-image">
                    <i class="fas fa-box"></i>
                </div>
                <div class="cart-item-info">
                    <div class="cart-item-title">${item.product.name}</div>
                    ${item.variant ? `<div class="cart-item-variant">${item.variant.name}</div>` : ''}
                    <div class="cart-item-price">${item.price}₽</div>
                </div>
                <div class="cart-item-actions">
                    <div class="quantity-control">
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                        <input type="number" class="quantity-input" value="${item.quantity}" min="1" onchange="updateQuantity(${item.id}, parseInt(this.value))">
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${item.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `;
            return div;
        }

        // Update order summary
        function updateOrderSummary() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const deliveryCost = document.querySelector('input[name="delivery"]:checked').value === 'delivery' ? 300 : 0;
            const promoDiscount = currentPromo ? calculatePromoDiscount(subtotal) : 0;
            const total = subtotal + deliveryCost - promoDiscount;

            document.getElementById('subtotal').textContent = `${subtotal}₽`;
            document.getElementById('deliveryCost').textContent = `${deliveryCost}₽`;
            document.getElementById('total').textContent = `${total}₽`;

            if (promoDiscount > 0) {
                document.getElementById('promoDiscountRow').style.display = 'flex';
                document.getElementById('promoDiscount').textContent = `-${promoDiscount}₽`;
            } else {
                document.getElementById('promoDiscountRow').style.display = 'none';
            }

            // Enable/disable checkout button
            const checkoutBtn = document.getElementById('checkoutBtn');
            const customerName = document.getElementById('customerName').value;
            const customerPhone = document.getElementById('customerPhone').value;
            const paymentMethod = document.querySelector('input[name="payment"]:checked');

            checkoutBtn.disabled = !customerName || !customerPhone || !paymentMethod || cart.length === 0;
        }

        // Calculate promo discount
        function calculatePromoDiscount(subtotal) {
            if (!currentPromo) return 0;
            
            if (currentPromo.type === 'percent') {
                return Math.round(subtotal * currentPromo.value / 100);
            } else if (currentPromo.type === 'fixed') {
                return Math.min(currentPromo.value, subtotal);
            }
            return 0;
        }

        // Setup event listeners
        function setupEventListeners() {
            // Search
            const searchInput = document.getElementById('searchInput');
            const searchInput2 = document.getElementById('searchInput2');
            if (searchInput) searchInput.addEventListener('input', handleSearch);
            if (searchInput2) searchInput2.addEventListener('input', handleSearch);

            // Delivery method change
            document.querySelectorAll('input[name="delivery"]').forEach(radio => {
                radio.addEventListener('change', handleDeliveryChange);
            });

            // Payment method change
            document.querySelectorAll('input[name="payment"]').forEach(radio => {
                radio.addEventListener('change', updateOrderSummary);
            });

            // Customer info change
            const customerName = document.getElementById('customerName');
            const customerPhone = document.getElementById('customerPhone');
            if (customerName) customerName.addEventListener('input', updateOrderSummary);
            if (customerPhone) customerPhone.addEventListener('input', updateOrderSummary);

            // Promo code
            const applyPromoBtn = document.getElementById('applyPromoBtn');
            if (applyPromoBtn) applyPromoBtn.addEventListener('click', applyPromoCode);

            // Checkout
            const checkoutBtn = document.getElementById('checkoutBtn');
            if (checkoutBtn) checkoutBtn.addEventListener('click', processCheckout);
        }

        // Handle search
        function handleSearch(event) {
            searchQuery = event.target.value.toLowerCase();
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchQuery)
            );
            renderProducts(filteredProducts);
        }

        // Handle delivery method change
        function handleDeliveryChange() {
            const deliveryMethod = document.querySelector('input[name="delivery"]:checked').value;
            const pickupOptions = document.getElementById('pickupOptions');
            const deliveryOptions = document.getElementById('deliveryOptions');

            if (deliveryMethod === 'pickup') {
                pickupOptions.style.display = 'block';
                deliveryOptions.style.display = 'none';
            } else {
                pickupOptions.style.display = 'none';
                deliveryOptions.style.display = 'block';
            }

            updateOrderSummary();
        }

        // Apply promo code
        async function applyPromoCode() {
            const promoCode = document.getElementById('promoCode').value.trim();
            if (!promoCode) return;

            try {
                const response = await fetch('/api/promo/apply', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ code: promoCode })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentPromo = data;
                    showPromoApplied(data);
                    updateOrderSummary();
                } else {
                    const error = await response.json();
                    alert(error.detail || 'Промокод не найден');
                }
            } catch (error) {
                console.error('Error applying promo:', error);
                alert('Ошибка применения промокода');
            }
        }

        // Show promo applied
        function showPromoApplied(promo) {
            const container = document.getElementById('promoApplied');
            container.style.display = 'block';
            container.innerHTML = `
                <i class="fas fa-check-circle"></i>
                <span>Промокод "${promo.code}" применен</span>
                <button class="promo-remove" onclick="removePromo()">
                    <i class="fas fa-times"></i>
                </button>
            `;
        }

        // Remove promo
        function removePromo() {
            currentPromo = null;
            document.getElementById('promoCode').value = '';
            document.getElementById('promoApplied').style.display = 'none';
            updateOrderSummary();
        }

        // Process checkout
        async function processCheckout() {
            const deliveryMethod = document.querySelector('input[name="delivery"]:checked').value;
            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
            const customerName = document.getElementById('customerName').value;
            const customerPhone = document.getElementById('customerPhone').value;

            const orderData = {
                delivery_type: deliveryMethod,
                payment_method: paymentMethod,
                customer_name: customerName,
                customer_phone: customerPhone,
                items: cart.map(item => ({
                    product_id: item.product_id,
                    variant_id: item.variant_id,
                    quantity: item.quantity,
                    price: item.price
                }))
            };

            if (deliveryMethod === 'pickup') {
                orderData.pickup_location = document.getElementById('pickupLocation').value;
            } else {
                orderData.delivery_address = document.getElementById('deliveryAddress').value;
            }

            if (currentPromo) {
                orderData.promo_code = currentPromo.code;
            }

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const order = await response.json();
                    showSuccess('Заказ успешно оформлен!');
                    cart = [];
                    renderCart();
                } else {
                    const error = await response.json();
                    alert(error.detail || 'Ошибка оформления заказа');
                }
            } catch (error) {
                console.error('Error creating order:', error);
                alert('Ошибка оформления заказа');
            }
        }

        // Setup promo rotation
        function setupPromoRotation() {
            setInterval(() => {
                currentPromoIndex = (currentPromoIndex + 1) % promoBanners.length;
                updatePromoBanner();
            }, 15000);
        }

        // Update promo banner
        function updatePromoBanner() {
            const banner = promoBanners[currentPromoIndex];
            const promoIcon = document.getElementById('promoIcon');
            const promoTitle = document.getElementById('promoTitle');
            const promoSubtitle = document.getElementById('promoSubtitle');
            
            if (promoIcon) promoIcon.className = `fas ${banner.icon} promo-icon`;
            if (promoTitle) promoTitle.textContent = banner.title;
            if (promoSubtitle) promoSubtitle.textContent = banner.subtitle;
        }

        // Show page
        function showPage(page) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            
            // Show selected page
            document.getElementById(page + 'Page').style.display = 'block';
            
            // Update navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.nav-item').classList.add('active');

            // Load page data
            switch(page) {
                case 'home':
                    loadProducts();
                    break;
                case 'search':
                    document.getElementById('searchInput2').value = searchQuery;
                    handleSearch({ target: { value: searchQuery } });
                    break;
                case 'favorites':
                    loadFavorites();
                    break;
                case 'profile':
                    loadProfile();
                    break;
            }
        }

        // Load profile
        async function loadProfile() {
            try {
                const response = await fetch('/api/users/cashback', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    renderCashbackStats(data);
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        // Render cashback stats
        function renderCashbackStats(data) {
            const container = document.getElementById('cashbackStats');
            container.innerHTML = `
                <div class="summary-row">
                    <span class="summary-label">Всего получено:</span>
                    <span class="summary-value">${data.stats.total_cashback}₽</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Начислений:</span>
                    <span class="summary-value">${data.stats.transactions_count}</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Средний кешбек:</span>
                    <span class="summary-value">${data.stats.average_cashback}₽</span>
                </div>
            `;
        }

        // Toggle favorite
        async function toggleFavorite(productId, event) {
            event.stopPropagation();
            
            try {
                const response = await fetch('/api/favorites', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ product_id: productId })
                });

                if (response.ok) {
                    await loadFavorites();
                    updateFavoritesBadge();
                }
            } catch (error) {
                console.error('Error toggling favorite:', error);
            }
        }

        // Add to cart
        async function addToCart(productId, event) {
            event.stopPropagation();
            
            try {
                const response = await fetch('/api/cart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ product_id: productId, quantity: 1 })
                });

                if (response.ok) {
                    await loadCart();
                    updateCartBadge();
                }
            } catch (error) {
                console.error('Error adding to cart:', error);
            }
        }

        // Update quantity
        async function updateQuantity(cartItemId, quantity) {
            if (quantity < 1) return;
            
            try {
                const response = await fetch(`/api/cart/${cartItemId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ quantity })
                });

                if (response.ok) {
                    await loadCart();
                    updateCartBadge();
                }
            } catch (error) {
                console.error('Error updating quantity:', error);
            }
        }

        // Remove from cart
        async function removeFromCart(cartItemId) {
            try {
                const response = await fetch(`/api/cart/${cartItemId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (response.ok) {
                    await loadCart();
                    updateCartBadge();
                }
            } catch (error) {
                console.error('Error removing from cart:', error);
            }
        }

        // Update favorites badge
        function updateFavoritesBadge() {
            const badge = document.getElementById('favoritesBadge');
            if (favorites.length > 0) {
                badge.style.display = 'block';
                badge.textContent = favorites.length;
            } else {
                badge.style.display = 'none';
            }
        }

        // Update cart badge
        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (totalItems > 0) {
                badge.style.display = 'block';
                badge.textContent = totalItems;
            } else {
                badge.style.display = 'none';
            }
        }

        // Open category
        function openCategory(categoryId) {
            const categoryProducts = products.filter(p => p.category_id === categoryId);
            renderProducts(categoryProducts);
        }

        // Open product
        function openProduct(productId) {
            console.log('Opening product:', productId);
            // TODO: Implement product detail page
        }

        // Show error
        function showError(message) {
            document.querySelector('.main').innerHTML = `
                <div class="container">
                    <div class="error">
                        <div class="error-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="error-title">Ошибка</div>
                        <div class="error-message">${message}</div>
                    </div>
                </div>
            `;
        }

        // Show success
        function showSuccess(message) {
            document.querySelector('.main').innerHTML = `
                <div class="container">
                    <div class="success">
                        <div class="success-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="success-title">Успешно</div>
                        <div class="success-message">${message}</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
